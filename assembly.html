<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지그 조립 연습</title>
<meta name="description" content="싱글·탠덤·탠덤 3T 제작판 측정 지그를 CAD 순서대로 3D에서 조립해 보는 연습: 납땜, 점검, 나사, 부품 조립, 3T 창 닦기와 mid 핀">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout as the 3D viewer (index.html): the bench (3D) beside a rail; on a phone the bench sits on top and the rail scrolls below it. */
:root {
  --bg: #f3f5f2; --panel: #ffffff; --fg: #18211c; --muted: #5d6a62; --line: #d9dfd9;
  --accent: #1f6b45; --stage: #e9ede8; --ok: #1f7a4d; --bad: #b3261e;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101513; --panel: #171e1b; --fg: #e4ebe6; --muted: #9aa8a0; --line: #2a3530;
  --accent: #4fb582; --stage: #141b18; --ok: #5cc392; --bad: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101513; --panel: #171e1b; --fg: #e4ebe6; --muted: #9aa8a0; --line: #2a3530;
  --accent: #4fb582; --stage: #141b18; --ok: #5cc392; --bad: #ff8a80; color-scheme: dark }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.app { display: flex; height: 100vh; height: 100svh; }
.stage { position: relative; flex: 1 1 auto; min-width: 0; background: var(--stage); overflow: hidden; }
#c { display: block; width: 100%; height: 100%; touch-action: none; }
.rail { flex: 0 0 380px; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.rail > * { flex-shrink: 0; }   /* the rail scrolls; its blocks must not shrink */
a { color: var(--accent); }
.back { font-size: 12.5px; font-weight: 600; text-decoration: none; }
h1 { font-size: 19px; font-weight: 700; margin: 2px 0 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
.seg2 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg2 button { font: inherit; font-size: 13px; padding: 8px 4px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.seg2 button + button { border-left: 1px solid var(--line); }
.seg2 button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.bar { display: flex; gap: 2px; height: 7px; }
.bar span { flex: 1; border-radius: 2px; background: var(--line); }
.bar span.done { background: var(--accent); }
.bar span.cur { background: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card .phase { font-size: 11.5px; font-weight: 600; color: var(--accent); margin: 0; }
.card h2 { font-size: 16px; margin: 2px 0 6px; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; font-size: 13.5px; }
.card .tip { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.card ul { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.card li label { display: flex; gap: 8px; align-items: flex-start; }
.card li input { margin-top: 3px; accent-color: var(--accent); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.picks .lab { width: 100%; font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 0; }
.pk { font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; text-align: left; display: inline-flex; gap: 7px; align-items: flex-start; }
.pk .n { flex: 0 0 auto; min-width: 19px; height: 19px; border-radius: 999px; background: var(--line); color: var(--fg); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.pk.done { border-color: var(--accent); color: var(--accent); }
.pk.done .n { background: var(--accent); color: #fff; }
.pk.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.pk .rd { display: block; font-size: 12px; color: var(--muted); }
.pk.kit { width: 100%; }
.pk.kit .q { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fb { min-height: 2.6em; margin: 0; font-size: 13px; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); font-weight: 600; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; }
.steps ol { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12.5px; }
.steps li.ph { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.steps button { font: inherit; width: 100%; text-align: left; background: transparent; border: 0; color: var(--fg); padding: 3px 4px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; }
.steps button.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
.steps button .s { width: 14px; color: var(--accent); }
.notes ul { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.tools { position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 5px;
  background: var(--panel); background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; }
.tool { width: 52px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 10px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 10.5px; line-height: 1.15; cursor: pointer; padding: 3px 1px; white-space: nowrap; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { background: var(--accent); color: #fff; }
.tool.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.chip { position: absolute; transform: translate(-50%, calc(-100% - 4px)); min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); white-space: nowrap; }
.chip.done { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip.read { cursor: default; pointer-events: none; font-weight: 600; background: var(--fg); color: var(--bg); border-color: var(--fg); }
.hud { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  background: var(--panel); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 9px; border-radius: 6px; pointer-events: none; }
.refit { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 6px; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); cursor: pointer; }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; padding: 16px; text-align: center; }
@media (max-width: 760px) {
  .app { flex-direction: column; }
  .stage { flex: 0 0 auto; height: 50vh; height: 50svh; min-height: 280px; }
  .rail { flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--line); }
  .tool { width: 50px; }
}
@media (prefers-reduced-motion: reduce) { .tool.shake { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="조립 연습 3D 장면"></canvas>
    <div id="chips"></div>
    <div class="hud" id="hud"></div>
    <button class="refit" id="refit" type="button">보기 맞춤</button>
    <div class="status" id="status">CAD 모델을 불러오는 중…</div>
    <div class="tools" id="tools" role="toolbar" aria-label="도구"></div>
  </div>
  <aside class="rail">
    <header>
      <a class="back" href="./">← 지그 3D 보기</a>
      <h1>지그 조립 연습</h1>
      <p class="sub">제작판 CAD 순서대로: 도구를 고르고, 맞는 부품이나 빛나는 자리를 누른다. 끌면 회전, 두 손가락으로 확대.</p>
    </header>
    <div class="seg2" role="group" aria-label="지그 고르기">
      <button id="tr-single" type="button" aria-pressed="true">제작 싱글</button>
      <button id="tr-tandem" type="button" aria-pressed="false">제작 탠덤</button>
      <button id="tr-tandem3t" type="button" aria-pressed="false">탠덤 3T</button>
    </div>
    <div><div class="bar" id="bar"></div><div class="meta" id="meta"></div></div>
    <section class="card" id="card" aria-live="polite"></section>
    <div class="picks" id="picks"></div>
    <p class="fb" id="fb" aria-live="assertive"></p>
    <div class="ctrl">
      <button id="auto" class="btn" type="button">보기만 ▶</button>
      <button id="restart" class="btn ghost" type="button">처음부터</button>
      <button id="skip" class="btn ghost" type="button" hidden>건너뛰기</button>
    </div>
    <details class="steps"><summary>단계 전체 (눌러서 그 단계로)</summary><ol id="steps"></ol></details>
    <details class="notes"><summary>확인 전 (미검증)</summary><ul id="notes"></ul></details>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="jig_models.js"></script>
<script src="assembly.js"></script>
</body>
</html>
